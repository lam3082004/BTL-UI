# Render Blueprint: Web Service + Postgres.
# After the first successful deploy, set DATABASE_SYNCHRONIZE=false unless you rely on auto-schema.
# Set GOOGLE_* and FRONTEND_* in the Render dashboard to match your Google OAuth app and Vercel URL.
# PORT is injected by Render; do not override it.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: numsense-api
    runtime: node
    plan: free
    rootDir: backend
    # Install devDependencies for nest build (NODE_ENV=production otherwise omits them)
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SYNCHRONIZE
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: numsense-db
          property: connectionString

databases:
  - name: numsense-db
    plan: free
